%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/ti,am62a-fsas.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments K3 Flash SubSystem FSAS

maintainers:
  - Santhosh Kumar K <s-k6@ti.com>

description:
  The FSS_FSAS_GENREGS block is a TI wrapper inside the Flash SubSystem (FSS).

properties:
  compatible:
    const: ti,am62a-fsas

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - power-domains

additionalProperties: false

examples:
  - |
    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        fsas@fc10000 {
            compatible = "ti,am62a-fsas";
            reg = <0x00 0x0fc10000 0x00 0x100>;
        };
    };
